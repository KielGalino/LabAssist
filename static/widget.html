<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSIS ICT Laboratory Helpdesk</title>
<!-- Chat widget (served at /widget, uses POST /api/chat/stream). -->
<style>
  :root { --primary:#310098; --secondary:#036403; --accent:#C9A800; --alert:#B3261E;
          --text:#1C1A2E; --muted:#4F4C63; --border:#DAD7E8; --surface:#F5F4FA; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin:0; height:100%; font:16px/1.45 "Source Sans Pro", "Segoe UI", sans-serif;
               color:var(--text); background:#fff; }
  .app { display:flex; flex-direction:column; height:100%; }
  header { display:flex; align-items:center; gap:10px; padding:10px 12px;
           border-bottom:3px solid var(--accent); }
  header img { width:40px; height:40px; }
  header h1 { margin:0; font-size:1.02rem; color:var(--primary); line-height:1.2; }
  header p { margin:0; font-size:.8rem; color:var(--muted); }
  main { flex:1; overflow-y:auto; padding:12px; background:#fff; }
  .identify { display:flex; flex-direction:column; gap:10px; }
  .roles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .roles button { padding:14px 10px; font-size:1rem; }
  .roles button.teacher { background:var(--secondary); }
  label { font-size:.88rem; font-weight:600; }
  input, select, textarea { width:100%; padding:8px 10px; font:inherit; border:1px solid var(--border);
                            border-radius:6px; background:var(--surface); color:var(--text); }
  button { padding:9px 14px; font:600 .95rem sans-serif; border:none; border-radius:6px;
           background:var(--primary); color:#fff; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .note { font-size:.85rem; color:var(--muted); }
  .error { color:var(--alert); font-size:.9rem; }
  .msg { margin:0 0 10px; padding:8px 11px; border-radius:8px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { background:var(--surface); border:1px solid var(--border); margin-left:36px; }
  .msg.bot { background:#fff; border:1px solid var(--border); margin-right:12px; }
  .card { margin:-4px 12px 10px 0; padding:7px 10px; border:1px solid var(--border); border-radius:6px;
          font-size:.88rem; background:var(--surface); }
  .pill { display:inline-block; padding:0 8px; border-radius:999px; font-size:.78rem; font-weight:700;
          background:#FBF5D9; color:#5E4F00; border:1px solid #E9D98A; margin-left:4px; }
  .meta { font-size:.75rem; color:var(--muted); margin:-6px 0 10px 2px; }
  footer { display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--border); }
  footer textarea { resize:none; height:42px; }
  .who { font-size:.8rem; color:var(--muted); padding:0 12px 6px; }
  .who a { color:var(--primary); cursor:pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="/assets/csis-logo.png" alt="CSIS logo">
    <div><h1>CSIS ICT Laboratory Helpdesk</h1><p>LabAssist - first-level support</p></div>
  </header>

  <main id="main">
    <div class="identify" id="identify">
      <p class="note">Good day. No sign-in is needed. Are you a student or a teacher?</p>
      <div class="roles">
        <button type="button" data-role="student">Student</button>
        <button type="button" class="teacher" data-role="teacher">Teacher</button>
      </div>
      <p class="error" id="idError"></p>
    </div>
  </main>

  <div class="who" id="who" hidden></div>
  <footer id="composer" hidden>
    <textarea id="text" maxlength="1000" placeholder="Describe your lab IT problem (include the unit, e.g. PC-12)"></textarea>
    <button id="send">Send</button>
  </footer>
</div>

<script>
  // state for this browser tab
  const store = {
    get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
    clear() { try { sessionStorage.clear(); } catch (e) {} },
  };
  let me = JSON.parse(store.get("labassist_me") || "null");   // {role, client_id}
  let conversationId = Number(store.get("labassist_conv")) || null;
  const $ = (id) => document.getElementById(id);
  const STATUS = { pending_approval: "Pending approval", open: "Open", resolved: "Resolved",
                   escalated: "Escalated", in_progress: "In progress", rejected: "Rejected" };

  // random id for this tab
  function newClientId() {
    const a = new Uint8Array(6);
    crypto.getRandomValues(a);
    return Array.from(a, b => b.toString(16).padStart(2, "0")).join("");
  }

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;                       // no HTML injection
    $("main").appendChild(div);
    $("main").scrollTop = $("main").scrollHeight;
    return div;
  }

  function addCard(text, status) {
    const div = document.createElement("div");
    div.className = "card";
    div.textContent = text;
    if (status) {
      const pill = document.createElement("span");
      pill.className = "pill";
      pill.textContent = STATUS[status] || status;
      div.appendChild(pill);
    }
    $("main").appendChild(div);
  }

  function backToIdentify(reason) {
    // refused: show the reason and the role buttons again
    store.clear(); me = null; conversationId = null;
    $("composer").hidden = true; $("who").hidden = true;
    $("identify").hidden = false;
    $("idError").textContent = reason;
    $("main").querySelectorAll(".msg, .card, .meta").forEach(el => el.remove());
    $("main").scrollTop = 0;
  }

  function startChat() {
    $("identify").hidden = true;
    $("idError").textContent = "";
    $("composer").hidden = false;
    $("who").hidden = false;
    $("who").innerHTML = "";
    $("who").append(`Chatting as a ${me.role} - `);
    const link = document.createElement("a");
    link.textContent = "change";
    link.onclick = () => { store.clear(); location.reload(); };
    $("who").appendChild(link);
    if (!$("main").querySelector(".msg")) {
      addMessage("bot", "Good day. Describe the problem with the lab computer and include the unit " +
                        "number (for example PC-12). You can write in English or Taglish.");
    }
    $("text").focus();
  }

  document.querySelectorAll("[data-role]").forEach(btn => btn.addEventListener("click", () => {
    me = { role: btn.dataset.role, client_id: newClientId() };
    store.set("labassist_me", JSON.stringify(me));
    conversationId = null;
    startChat();
  }));

  // send a message and read the streamed answer (SSE)
  async function send() {
    const text = $("text").value.trim();
    if (!text) return;
    $("text").value = "";
    $("send").disabled = true;
    addMessage("user", text);
    const bubble = addMessage("bot", "...");
    let started = false;
    try {
      const resp = await fetch("/api/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...me, message: text, conversation_id: conversationId }),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        bubble.textContent = err.detail ? String(err.detail) : "The helpdesk is unavailable. Please try again.";
        if (resp.status === 400 || resp.status === 403) backToIdentify(bubble.textContent);
        return;
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buffer.indexOf("\n\n")) >= 0) {          // one SSE event per blank line
          const raw = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
          const event = (raw.match(/^event: (.*)$/m) || [])[1];
          const data = JSON.parse((raw.match(/^data: (.*)$/m) || [])[1] || "{}");
          if (event === "token") {
            if (!started) { bubble.textContent = ""; started = true; }
            bubble.textContent += data.text.replace(/\*\*/g, "");
            $("main").scrollTop = $("main").scrollHeight;
          } else if (event === "done") {
            conversationId = data.conversation_id;
            store.set("labassist_conv", conversationId);
            bubble.textContent = data.reply.replace(/\*\*/g, "");
            for (const a of data.actions || []) {
              const d = a.data || {};
              if (a.ok && d.ticket_no) addCard(`${d.ticket_no} - unit ${d.unit || "-"}`, d.status);
              else if (!a.ok) addCard(a.message);
            }
            const meta = document.createElement("div");
            meta.className = "meta";
            meta.textContent = (data.sources.length ? "Sources: " + data.sources.join(", ") + " | " : "") +
                               (data.latency_ms / 1000).toFixed(1) + " s";
            $("main").appendChild(meta);
          } else if (event === "error") {
            bubble.textContent = "Something went wrong. Please try again.";
          }
        }
      }
    } catch (e) {
      bubble.textContent = "Cannot reach the helpdesk server. Please try again.";
    } finally {
      $("send").disabled = false;
      $("main").scrollTop = $("main").scrollHeight;
    }
  }

  $("send").addEventListener("click", send);
  $("text").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  if (me) startChat();
</script>
</body>
</html>
