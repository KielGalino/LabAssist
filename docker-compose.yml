# UI at :8501, API at :8000 (docker compose up --build)
# The database is in a Docker volume (SQLite locking fails on Windows shared folders).
services:
  ui:
    build: .
    image: labassist:latest
    ports: ["8501:8501"]
    env_file: .env
    volumes:
      - labassist-data:/data
      - ./kb:/app/kb
    restart: unless-stopped

  api:
    image: labassist:latest          # same image as the UI
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    env_file: .env
    volumes:
      - labassist-data:/data
      - ./kb:/app/kb
    depends_on: [ui]                 # UI creates the database
    restart: unless-stopped

volumes:
  labassist-data:
